<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>인사이트 공유 서비스 — 프로토타입 v2</title>
<meta name="description" content="기업 블로그 글을 읽고 독후감(인사이트)을 공유하는 커뮤니티 앱 · design.md 적용" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
<style>
  /* ===== design.md tokens ===== */
  :root{
    --bg:#F1F2F4; --card:#FFFFFF; --card-strong:#EAECEF;
    --text:#14161A; --text-sub:#5F636B;
    --blue:#056DFF; --orange:#C75300; --orange-hot:#FF6A00;
    --lime:#A3D600; --sky:#1FA0E8;
    --r-card:12px; --r-badge:6px; --r-chip:20px;
    --font: "Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
    --mono: "JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#101215; --card:#1A1D21; --card-strong:#242830; --text:#F1F2F4; --text-sub:#8A9099; }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font); background:#0b0c0e; color:var(--text);
    display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px 0;
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion:reduce){ *{animation:none !important; transition:none !important;} }

  .phone{
    width:390px; max-width:100vw; height:844px; max-height:100vh;
    background:var(--bg); border-radius:40px; overflow:hidden; position:relative;
    display:flex; flex-direction:column; box-shadow:0 30px 60px -20px rgba(0,0,0,.5);
  }
  @media (max-width:430px){ body{padding:0;background:var(--bg);} .phone{border-radius:0; height:100vh; box-shadow:none;} }

  .screen{ flex:1; overflow-y:auto; overflow-x:hidden; position:relative; }
  .screen::-webkit-scrollbar{width:0;}
  .pad{ padding:0 16px; }
  .hidden{ display:none !important; }
  .mono{ font-family:var(--mono); }

  /* appbar */
  .appbar{ position:sticky; top:0; z-index:20; background:var(--bg); display:flex; align-items:center; gap:10px; padding:16px 16px 12px; }
  .appbar .title{ font-size:22px; font-weight:500; letter-spacing:-0.4px; line-height:1.3; }
  .appbar .spacer{ flex:1; }
  .iconbtn{ width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:transparent; border:none; cursor:pointer; color:var(--text); position:relative; }
  .iconbtn:active{ background:var(--card); }
  .badge-dot{ position:absolute; top:7px; right:8px; width:7px; height:7px; border-radius:50%; background:var(--blue); }

  svg.i{ width:22px; height:22px; stroke:currentColor; stroke-width:1.8; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  svg.i.sm{ width:15px; height:15px; }
  svg.i.lg{ width:26px; height:26px; }

  .logo{ display:inline-flex; align-items:center; gap:0; }
  .logo .name{ font-weight:500; font-size:22px; letter-spacing:-0.6px; }
  .logo .dot{ color:var(--blue); font-weight:500; }

  .sec-title{ font-size:13px; font-weight:500; color:var(--text-sub); margin:20px 0 10px; letter-spacing:-0.2px; }
  .subhead{ font-size:12px; color:var(--text-sub); line-height:1.6; margin:2px 0 12px; }

  /* chips */
  .chips{ display:flex; gap:8px; overflow-x:auto; padding:2px 0; }
  .chips::-webkit-scrollbar{height:0;}
  .chip{ flex:0 0 auto; height:32px; display:flex; align-items:center; padding:0 14px; border-radius:var(--r-chip); background:var(--card); color:var(--text-sub); font-size:12px; font-weight:500; border:none; cursor:pointer; white-space:nowrap; }
  .chip.on{ background:var(--blue); color:#fff; }

  /* card — gray surface, no border/shadow, left category bar */
  .card{ position:relative; background:var(--card); border-radius:0 var(--r-card) var(--r-card) 0; padding:13px 14px; margin-bottom:8px; cursor:pointer; border-left:3px solid var(--catc,transparent); animation:rise .22s ease-out both; }
  .card:active{ background:var(--card-strong); }
  @keyframes rise{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }
  .card .hd{ display:flex; align-items:flex-start; gap:8px; }
  .card h3{ margin:0; font-size:15px; font-weight:500; line-height:1.45; letter-spacing:-0.3px; flex:1; }
  .meta{ font-size:11px; color:var(--text-sub); line-height:1.4; margin-top:6px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .meta .sep::before{ content:"·"; margin:0 3px; }
  .tagrow{ display:flex; gap:6px; flex-wrap:wrap; margin-top:9px; }
  .tag{ font-size:11px; color:var(--text-sub); }
  .tag::before{ content:"#"; opacity:.5; }
  .cardacts{ display:flex; gap:8px; margin-top:11px; align-items:center; }
  .miniact{ width:28px; height:28px; border-radius:50%; background:var(--card-strong); display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .miniact svg{ width:15px; height:15px; }
  .cardacts .cnt{ font-family:var(--mono); font-size:11px; color:var(--text-sub); display:flex; align-items:center; gap:4px; }
  .byline{ display:flex; align-items:center; gap:5px; font-size:11px; color:var(--text-sub); }

  /* status badge — one per card */
  .badge{ flex:0 0 auto; height:22px; display:inline-flex; align-items:center; padding:0 9px; border-radius:var(--r-badge); font-size:11px; font-weight:500; }
  .badge.blue{ background:var(--blue); color:#fff; }
  .badge.orange{ background:var(--orange); color:#fff; }
  .badge.read{ background:var(--card-strong); color:var(--text-sub); }

  /* swipe */
  .swipe{ display:flex; gap:8px; overflow-x:auto; margin:0 -16px; padding:2px 16px 4px; }
  .swipe::-webkit-scrollbar{height:0;}
  .scard{ flex:0 0 76%; background:var(--card); border-radius:0 var(--r-card) var(--r-card) 0; border-left:3px solid var(--catc,transparent); padding:13px 14px; cursor:pointer; }

  /* company section header (홈) with favorite toggle */
  .comprow{ display:flex; align-items:center; gap:10px; margin:20px 0 10px; }
  .clogo{ width:24px; height:24px; border-radius:7px; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:500; font-size:11px; flex:0 0 auto; }
  .comprow .clogo{ width:40px; height:40px; border-radius:12px; font-size:17px; }
  .cname{ font-weight:500; font-size:16px; }
  .startoggle{ width:28px; height:28px; border-radius:50%; background:transparent; border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; margin-left:2px; }
  .startoggle svg{ width:19px; height:19px; stroke:var(--text-sub); fill:none; stroke-width:1.6; }
  .startoggle.on svg{ fill:var(--orange-hot); stroke:var(--orange-hot); }

  /* tab bar */
  .tabbar{ display:flex; background:var(--bg); padding:6px 4px calc(6px + env(safe-area-inset-bottom)); }
  .tab{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:5px 0; background:none; border:none; cursor:pointer; color:var(--text-sub); transition:color .12s; }
  .tab .lbl{ font-size:10px; font-weight:500; }
  .tab.on{ color:var(--blue); }

  /* fab — dark fill, not blue */
  .fab{ position:absolute; right:16px; bottom:76px; width:56px; height:56px; border-radius:50%; background:var(--text); color:var(--bg); border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:15; }
  .fab:active{ transform:scale(.94); }

  /* buttons */
  .btn{ width:100%; padding:14px; border-radius:12px; border:none; font-size:15px; font-weight:500; cursor:pointer; font-family:var(--font); }
  .btn.primary{ background:var(--blue); color:#fff; }
  .btn.primary:disabled{ background:var(--card-strong); color:var(--text-sub); cursor:not-allowed; }
  .btn.ghost{ background:var(--card); color:var(--text); }
  .btn.outline{ background:var(--card); color:var(--text); }
  .btn.google{ background:var(--card); color:var(--text); display:flex; align-items:center; justify-content:center; gap:10px; }

  /* detail */
  .d-title{ font-size:22px; font-weight:500; line-height:1.3; letter-spacing:-0.5px; margin:14px 0 10px; }
  .ai-card{ background:var(--card); border-radius:var(--r-card); padding:14px; margin:14px 0; }
  .ai-card .lab{ display:flex; align-items:center; gap:6px; font-family:var(--mono); font-size:11px; color:var(--text-sub); margin-bottom:12px; }
  .ai-q{ margin-bottom:12px; }
  .ai-q:last-child{ margin-bottom:0; }
  .ai-q .q{ font-size:12px; font-weight:500; color:var(--text-sub); margin-bottom:4px; }
  .ai-q .a{ font-size:14px; color:var(--text); line-height:1.6; }
  .article p{ font-size:16px; line-height:1.75; color:var(--text); margin:0 0 4px; padding:5px 6px; border-radius:6px; cursor:pointer; }
  .article p.hl{ background:rgba(199,83,0,.14); box-shadow:inset 3px 0 0 var(--orange); }
  .memo{ font-family:var(--font); font-size:12px; color:var(--text-sub); background:var(--card); padding:8px 10px; margin:2px 6px 10px; border-radius:8px; box-shadow:inset 3px 0 0 var(--orange); }
  .linkcard{ display:flex; gap:10px; align-items:center; background:var(--card); border-radius:12px; padding:14px; margin:14px 0; cursor:pointer; }
  .linkcard .txt{ font-family:var(--mono); font-size:11px; color:var(--text-sub); word-break:break-all; line-height:1.5; }

  /* review */
  .review{ background:var(--card); border-radius:var(--r-card); padding:14px; margin-bottom:8px; }
  .review.plain{ background:transparent; padding:0; }
  .who{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .avatar{ width:20px; height:20px; border-radius:50%; background:var(--card-strong); color:var(--text-sub); display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:500; flex:0 0 auto; }
  .avatar.lg{ width:44px; height:44px; font-size:17px; }
  .avatar.md{ width:38px; height:38px; font-size:15px; }
  .avatar.xs{ width:18px; height:18px; font-size:9px; }
  .rq{ margin-bottom:10px; }
  .rq .q{ font-size:11px; color:var(--text-sub); margin-bottom:3px; }
  .rq .a{ font-size:14px; line-height:1.6; }
  .review .foot{ display:flex; align-items:center; gap:12px; margin-top:6px; font-family:var(--mono); font-size:11px; color:var(--text-sub); }
  .review .foot .a{ display:flex; align-items:center; gap:5px; cursor:pointer; }

  /* forms */
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:12px; font-weight:500; color:var(--text-sub); margin-bottom:8px; }
  .input,textarea.input{ width:100%; border:none; background:var(--card); border-radius:11px; padding:12px; font-size:14px; font-family:var(--font); color:var(--text); resize:none; }
  .input:focus{ outline:1px solid var(--blue); }
  .input::placeholder{ color:var(--text-sub); }
  .hint{ font-size:11px; color:var(--text-sub); margin-top:7px; line-height:1.5; }

  /* search */
  .searchbar{ display:flex; align-items:center; gap:8px; background:var(--card); border-radius:var(--r-chip); padding:10px 14px; margin:12px 0; }
  .searchbar input{ border:none; background:none; flex:1; font-size:14px; outline:none; font-family:var(--font); color:var(--text); }
  .searchbar input::placeholder{ color:var(--text-sub); }
  .sb-clear{ flex:0 0 auto; width:22px; height:22px; border-radius:50%; background:var(--card-strong); border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text-sub); padding:0; }
  .sb-clear svg{ width:13px; height:13px; }
  .recent{ display:flex; align-items:center; gap:8px; padding:10px 2px; font-size:14px; color:var(--text); }
  .recent .x{ margin-left:auto; color:var(--text-sub); cursor:pointer; display:flex; }
  .rank{ display:flex; align-items:center; gap:12px; padding:9px 2px; font-size:14px; cursor:pointer; }
  .rank .n{ width:16px; font-family:var(--mono); font-size:13px; color:var(--blue); }
  .rec-q{ display:block; width:100%; text-align:left; padding:12px 14px; background:var(--card); border:none; border-radius:11px; margin-bottom:8px; font-size:13px; font-weight:500; color:var(--text); cursor:pointer; font-family:var(--font); }

  /* my */
  .profile{ display:flex; align-items:center; gap:12px; padding:14px 0; }
  .profile .nm{ font-size:17px; font-weight:500; }
  .profile .sub{ font-family:var(--mono); font-size:11px; color:var(--text-sub); margin-top:2px; }
  .seg{ display:flex; gap:8px; margin:8px 0 14px; }
  .seg button{ flex:1; height:32px; border:none; background:var(--card); font-size:12px; font-weight:500; color:var(--text-sub); border-radius:var(--r-chip); cursor:pointer; font-family:var(--font); }
  .seg button.on{ background:var(--blue); color:#fff; }

  /* notification */
  .noti{ display:flex; gap:10px; padding:13px 2px; }
  .noti .dot{ width:7px; height:7px; border-radius:50%; background:var(--blue); margin-top:6px; flex:0 0 auto; }
  .noti .dot.read{ background:transparent; }
  .noti .body{ font-size:14px; line-height:1.5; }
  .noti .body b{ font-weight:500; }
  .noti .sub{ font-size:12px; color:var(--text-sub); margin-top:2px; }
  .noti .t{ font-family:var(--mono); font-size:11px; color:var(--text-sub); margin-top:4px; }

  /* drawer */
  .scrim{ position:absolute; inset:0; background:rgba(0,0,0,.45); z-index:40; display:none; }
  .scrim.show{ display:block; }
  .drawer{ position:absolute; left:0; right:0; bottom:0; background:var(--bg); border-radius:20px 20px 0 0; z-index:50; transform:translateY(100%); transition:transform .28s cubic-bezier(.2,.9,.3,1.1); max-height:82%; display:flex; flex-direction:column; }
  .drawer.show{ transform:translateY(0); }
  .drawer .handle{ width:38px; height:4px; border-radius:2px; background:var(--card-strong); margin:10px auto 4px; }
  .drawer .dhead{ display:flex; align-items:center; padding:8px 16px 12px; font-weight:500; font-size:15px; }
  .drawer .dbody{ overflow-y:auto; padding:8px 16px 14px; }
  .drawer .dfoot{ display:flex; gap:8px; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); align-items:center; }
  .drawer .dfoot input{ flex:1; border:none; background:var(--card); border-radius:var(--r-chip); padding:11px 14px; font-size:14px; outline:none; font-family:var(--font); color:var(--text); }
  .sendbtn{ width:40px; height:40px; border-radius:50%; background:var(--blue); color:#fff; border:none; display:flex; align-items:center; justify-content:center; flex:0 0 auto; cursor:pointer; }
  .comment{ display:flex; gap:9px; margin-bottom:14px; }
  .comment .nm{ font-size:12px; font-weight:500; }
  .comment .tx{ font-size:14px; line-height:1.5; margin-top:2px; }
  .comment .tm{ font-family:var(--mono); font-size:10px; color:var(--text-sub); margin-top:3px; }

  .toast{ position:absolute; left:50%; bottom:100px; transform:translateX(-50%) translateY(20px); background:var(--text); color:var(--bg); padding:11px 16px; border-radius:10px; font-size:13px; font-weight:500; opacity:0; transition:all .25s; z-index:80; pointer-events:none; white-space:nowrap; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* empty state — the one place color pops */
  .empty{ text-align:center; padding:44px 24px; }
  .empty .art{ width:72px; height:72px; margin:0 auto 16px; border-radius:20px; background:var(--sky); position:relative; }
  .empty .art::after{ content:""; position:absolute; width:34px; height:34px; border-radius:50%; background:var(--lime); right:-8px; bottom:-8px; }
  .empty .msg{ font-size:15px; font-weight:500; color:var(--text); }
  .empty .btn{ width:auto; padding:10px 18px; margin-top:14px; display:inline-block; }

  .stage-note{ position:fixed; top:8px; left:8px; font-family:var(--mono); font-size:10px; color:#8A9099; z-index:100; }
</style>
</head>
<body>
<div class="stage-note">insight · prototype v2 · design.md 적용</div>
<div class="phone">
  <div class="screen" id="screen"></div>
  <button class="fab hidden" id="fab" onclick="pushView({type:'register'})" aria-label="글 등록"></button>
  <div id="tabbar"></div>
  <div class="scrim" id="scrim" onclick="closeDrawer()"></div>
  <div class="drawer" id="drawer"></div>
  <div class="toast" id="toast"></div>
</div>

<script>
/* ============ ICONS ============ */
const IC = {

/* ============ DATA ============ */
const COMPANIES = {
  toss:{name:'토스',color:'#3182F6',ini:'T',domain:'toss.tech'},
  woowa:{name:'우아한형제들',color:'#2AC1BC',ini:'우',domain:'techblog.woowahan.com'},

};
const CATS = ['프로덕트','디자인','기술','AI'];
// 카테고리 → 좌측 바 색 (design.md: 분류는 lime/sky/blue/orange, 5개 미만)
const CATC = { '프로덕트':'var(--sky)', '디자인':'var(--lime)', '기술':'var(--blue)', 'AI':'var(--orange-hot)' };

let posts = [
  { id:'g1', title:'제품 우선순위, 얼마나 자주 재조정해야 할까', comp:'toss', cat:'프로덕트',
    author:'김민수', date:'8월 8일', tags:['우선순위','로드맵'], parsed:true, bookmarked:false, read:false,
    ai:{ p:'팀 리듬과 시장 변화에 따라 우선순위 재조정 주기가 달라지는 문제를 다룬다',
         s:'6개 팀 사례를 분석해 스프린트 리듬을 기준으로 재조정 트리거를 잡는 법을 제시한다',
         l:'재조정 주기를 관성이 아니라 팀 리듬에 맞춰 명시적으로 설계해야 한다는 점' },

  const fab=$('fab'); fab.innerHTML=IC.plus;

  if(state.view){
    fab.classList.add('hidden');
    if(state.view.type==='detail') return renderDetail(state.view.pid);
    if(state.view.type==='register') return renderRegister();
    if(state.view.type==='notifications') return renderNotifications();
    if(state.view.type==='writeReview') return renderWriteReview(state.view.pid);
    if(state.view.type==='search') return renderSearch();
  }
  ({home:renderHome, feed:renderFeed, insight:renderInsight, my:renderMy}[state.tab])();

}

  return '';
}
function cardFull(p){
  const c=COMPANIES[p.comp];
  const comm=reviews.filter(r=>r.postId===p.id).reduce((a,r)=>a+r.comments.length,0);
  const by = p.source==='direct'
    ? `<span class="byline"><span class="avatar xs">${esc(p.author[0])}</span>${esc(p.author)}</span>`
    : `<span class="byline muted">자동 수집</span>`;
  return `<div class="card" style="--catc:${CATC[p.cat]}" onclick="openDetail('${p.id}')">
    <div class="hd"><h3>${esc(p.title)}</h3>${badgeFor(p)}</div>

}

   </div>
   <div class="pad">
     <div class="searchbar" onclick="pushView({type:'search'})" style="cursor:pointer;margin-top:4px">${IC.search}<span style="color:var(--text-sub);font-size:14px">글 제목·기업·태그 검색</span></div>
     ${recs.length?`<div class="sec-title">회원님을 위한 추천 글</div><div class="swipe">${recs.map(cardSwipe).join('')}</div>`:''}
     <div class="sec-title">기술 블로그 모아보기</div>
     <div class="chips">${chips.map(c=>{const on=sel.has(c);const label=c==='all'?'전체':COMPANIES[c].name;return `<button class="chip ${on?'on':''}" onclick="toggleHomeChip('${c}')">${label}</button>`;}).join('')}</div>
     ${visComps.map(ck=>{
        const cps=posts.filter(p=>p.comp===ck); if(!cps.length) return '';
        const fav=state.favorites.has(ck);
        return `<div class="comprow">${compLogo(ck)}<span class="cname">${COMPANIES[ck].name}</span>
          <button class="startoggle ${fav?'on':''}" onclick="event.stopPropagation();toggleFav('${ck}')" aria-label="즐겨찾기">${IC.star}</button></div>
          <div class="swipe">${cps.map(cardSwipe).join('')}</div>`;
      }).join('')||`<div class="empty"><div class="art"></div><div class="msg">선택한 기업의 글이 아직 없어요</div></div>`}
     <div style="height:90px"></div>
   </div>`;
}
function toggleHomeChip(c){ const s=state.homeChips; if(c==='all'){s.clear();s.add('all');} else {s.delete('all'); s.has(c)?s.delete(c):s.add(c); if(!s.size)s.add('all');} render(); }
function toggleFav(c){ const f=state.favorites; f.has(c)?f.delete(c):f.add(c); render(); toast(f.has(c)?`${COMPANIES[c].name} 즐겨찾기 추가`:`${COMPANIES[c].name} 즐겨찾기 해제`); }

/* ============ FEED ============ */
function renderFeed(){
  if(state.feedPreselectComp){ state.feedComps=new Set([state.feedPreselectComp]); state.feedPreselectComp=null; }
  let list=posts.slice().sort((a,b)=>b.ord-a.ord); // 전체 최신순
  if(state.feedSeg==='bookmark') list=list.filter(p=>p.bookmarked);
  if(state.feedComps.size) list=list.filter(p=>state.feedComps.has(p.comp));
  const catFilters=[...state.feedCats].filter(c=>CATS.includes(c));
  if(catFilters.length) list=list.filter(p=>catFilters.includes(p.cat));
  if(state.feedCats.has('직접 등록')) list=list.filter(p=>p.source==='direct');
  screen().innerHTML=`
   <div class="appbar"><span class="title">피드</span></div>
   <div class="pad">
     <div class="seg">
       <button class="${state.feedSeg==='all'?'on':''}" onclick="state.feedSeg='all';render()">전체</button>
       <button class="${state.feedSeg==='bookmark'?'on':''}" onclick="state.feedSeg='bookmark';render()">북마크</button>
     </div>
     <div class="chips">${Object.keys(COMPANIES).map(c=>`<button class="chip ${state.feedComps.has(c)?'on':''}" onclick="toggleSet(state.feedComps,'${c}')">${COMPANIES[c].name}</button>`).join('')}</div>
     <div class="chips" style="margin-top:8px">${[...CATS,'직접 등록'].map(c=>`<button class="chip ${state.feedCats.has(c)?'on':''}" onclick="toggleSet(state.feedCats,'${c}')">${c==='직접 등록'?'✍ 직접 등록':c}</button>`).join('')}</div>
     <div style="height:14px"></div>
     ${list.length? list.map(cardFull).join('') : `<div class="empty"><div class="art"></div><div class="msg">조건에 맞는 글이 없어요</div></div>`}
     <div style="height:80px"></div>
   </div>`;
}
function toggleSet(set,v){ set.has(v)?set.delete(v):set.add(v); render(); }

/* ============ INSIGHT ============ */
function renderInsight(){
  const list=reviews.slice().reverse();
  screen().innerHTML=`
   <div class="appbar"><span class="title">인사이트</span></div>
   <div class="pad">
     <div class="subhead">인사이터들이 남긴 독후감을 최신순으로 만나보세요</div>
     ${list.map(r=>{
        const p=posts.find(x=>x.id===r.postId);
        const first=r.ans.find(a=>a&&a.trim());
        return `<div class="review" onclick="openReview('${r.id}')">
          <div class="who"><span class="avatar md">${r.ini}</span>
            <div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:500">${esc(r.author)}</div>
              <div class="meta mono">${r.date}</div></div></div>
          <div style="font-size:12px;color:var(--text-sub);margin:2px 0 8px">${esc(p.title)}</div>
          <div class="rq"><div class="a">${esc(first)}</div></div>
          <div class="foot"><span class="a">${IC.comment} 댓글 ${r.comments.length}</span></div>
        </div>`;
     }).join('')}
     <div style="height:80px"></div>
   </div>`;
}

/* ============ SEARCH ============ */
function renderSearch(){
  screen().innerHTML=`
   <div class="appbar"><button class="iconbtn" onclick="back()">${IC.back}</button><span class="title">검색</span></div>
   <div class="pad">
     <div class="searchbar">${IC.search}<input id="searchInput" placeholder="글 제목·기업·태그 검색" oninput="onSearchInput(this.value)" autofocus/><button class="sb-clear" id="sbClear" onclick="clearSearch()" style="display:none" aria-label="입력 지우기">${IC.x}</button></div>
     <div id="searchResults"></div>
     <div id="searchDefault">
       <div class="sec-title">최근 검색어</div>
       ${recentSearches.length? recentSearches.map((q,i)=>`<div class="recent"><span style="display:flex;align-items:center;gap:8px;flex:1;cursor:pointer" onclick="doSearch('${esc(q)}')">${IC.search}<span>${esc(q)}</span></span><span class="x" onclick="removeRecent(${i})">${IC.x}</span></div>`).join('') : '<div class="hint">최근 검색어가 없어요</div>'}
       <div class="sec-title">추천 검색어</div>
       ${recQueries.map(q=>`<button class="rec-q" onclick="doSearch('${esc(q)}')">${esc(q)}</button>`).join('')}
       <div class="sec-title">급상승 검색어</div>
       ${risingSearches.map((q,i)=>`<div class="rank" onclick="doSearch('${esc(q)}')"><span class="n">${i+1}</span><span>${esc(q)}</span></div>`).join('')}
       <div style="height:80px"></div>
     </div>
   </div>`;
}
function onSearchInput(v){
  const rd=$('searchDefault'), rr=$('searchResults');
  const clr=$('sbClear'); if(clr) clr.style.display=v.trim()?'flex':'none';
  if(!v.trim()){ rd.classList.remove('hidden'); rr.innerHTML=''; return; }
  rd.classList.add('hidden'); const q=v.toLowerCase();
  const res=posts.filter(p=>p.title.toLowerCase().includes(q)||COMPANIES[p.comp].name.toLowerCase().includes(q)||p.tags.some(t=>t.toLowerCase().includes(q)));
  rr.innerHTML=`<div class="sec-title">검색 결과 ${res.length}</div>`+(res.length?res.map(cardFull).join(''):'<div class="empty"><div class="art"></div><div class="msg">결과가 없어요</div></div>');
}
function doSearch(q){ $('searchInput').value=q; if(!recentSearches.includes(q))recentSearches.unshift(q); onSearchInput(q); }
function clearSearch(){ const inp=$('searchInput'); inp.value=''; onSearchInput(''); inp.focus(); }
function removeRecent(i){ recentSearches.splice(i,1); render(); }

/* ============ MY ============ */
function renderMy(){
  const seg=state.mySeg;
  const insightPosts=reviews.filter(r=>r.author==='다람쥐').map(r=>posts.find(p=>p.id===r.postId)).filter(Boolean);
  const commentPosts=[posts.find(p=>p.id==='g2')].filter(Boolean);
  const hlPosts=Object.keys(state.highlights).filter(pid=>state.highlights[pid].size).map(pid=>posts.find(p=>p.id===pid)).filter(Boolean);
  let body='';
  if(seg==='insight'){
    body=myDrafts.map(d=>`<div class="card" style="--catc:var(--card-strong)"><div class="hd"><h3>${esc(d.title)}</h3><span class="badge blue">작성중</span></div><div class="meta mono">${COMPANIES[d.comp].domain}<span class="sep"></span>${d.date}</div></div>`).join('')
      + insightPosts.map(cardFull).join('')
      + (!myDrafts.length&&!insightPosts.length?emptyInvite('첫 독후감을 남겨보세요'):'');
  } else if(seg==='comment'){
    body=commentPosts.length?commentPosts.map(cardFull).join(''):emptyInvite('마음에 든 독후감에 댓글을 달아보세요');
  } else {
    body=hlPosts.length?hlPosts.map(cardFull).join(''):emptyInvite('원문에서 문장을 하이라이트해보세요');
  }
  screen().innerHTML=`
   <div class="appbar"><span class="title">마이</span></div>
   <div class="pad">
     <div class="profile"><span class="avatar lg">다</span><div><div class="nm">다람쥐</div><div class="sub">기획자 스터디 · 인사이터</div></div></div>
     <div class="seg">
       <button class="${seg==='insight'?'on':''}" onclick="state.mySeg='insight';render()">인사이트</button>
       <button class="${seg==='comment'?'on':''}" onclick="state.mySeg='comment';render()">댓글</button>
       <button class="${seg==='hl'?'on':''}" onclick="state.mySeg='hl';render()">하이라이트</button>
     </div>
     ${body}
     <div style="height:80px"></div>
   </div>`;
}
function emptyInvite(msg){ return `<div class="empty"><div class="art"></div><div class="msg">${msg}</div></div>`; }

/* ============ NOTIFICATIONS ============ */
function renderNotifications(){
  notifications.forEach(n=>n.read=true);
  const seg=state.notiSeg;
  const list = seg==='all'?notifications : notifications.filter(n=>n.type===seg);
  screen().innerHTML=`
   <div class="appbar"><button class="iconbtn" onclick="back()">${IC.back}</button><span class="title">알림</span></div>
   <div class="pad">
     <div class="seg">
       <button class="${seg==='all'?'on':''}" onclick="state.notiSeg='all';render()">전체</button>
       <button class="${seg==='new'?'on':''}" onclick="state.notiSeg='new';render()">새 글</button>
       <button class="${seg==='comment'?'on':''}" onclick="state.notiSeg='comment';render()">독후감 댓글</button>
     </div>
     ${list.length? list.map(n=>`<div class="noti"><span class="dot ${n.read?'read':''}"></span><div><div class="body">${n.txt}</div><div class="sub">${esc(n.sub)}</div><div class="t">${n.t}</div></div></div>`).join('') : emptyInvite('알림이 없어요')}
   </div>`;
}

/* ============ DETAIL ============ */
function renderDetail(pid){
  const p=posts.find(x=>x.id===pid);
  const revs=reviews.filter(r=>r.postId===pid);
  const hl=state.highlights[pid]||new Set();
  const memos=state.memos[pid]||{};
  let bodyHtml;
  if(p.parsed&&p.body){
    bodyHtml=`<div class="article">${p.body.map((s,i)=>`<p class="${hl.has(i)?'hl':''}" onclick="tapSentence('${pid}',${i})">${esc(s)}</p>${memos[i]?`<div class="memo">${esc(memos[i])}</div>`:''}`).join('')}</div>`;
  } else {
    bodyHtml=`<div class="linkcard" onclick="toast('원문 링크로 이동해요')">${IC.ext}<div class="txt">원문이 없어 하이라이트·메모를 지원하지 않아요<br/>${esc(p.url||'원문 링크')}</div></div>`;
  }
  screen().innerHTML=`
   <div class="appbar"><button class="iconbtn" onclick="back()">${IC.back}</button><span class="spacer"></span>
     <button class="iconbtn" onclick="toggleBookmark('${pid}')" aria-label="북마크">${p.bookmarked?IC.bookmarkOn:IC.bookmark}</button></div>
   <div class="pad" id="detailInner">
     <div style="height:3px;width:28px;background:${CATC[p.cat]};border-radius:2px;margin-bottom:12px"></div>
     <h1 class="d-title">${esc(p.title)}</h1>
     <div class="comprow" style="margin-top:0" onclick="gotoCompFeed('${p.comp}')">${compLogo(p.comp)}<span class="cname">${COMPANIES[p.comp].name}</span>
       <span class="meta mono" style="margin-left:8px">${esc(p.author)}<span class="sep"></span>${p.date}</span></div>
     <div class="tagrow">${p.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
     <div class="ai-card">
       <div class="lab">AI 요약</div>
       <div class="ai-q"><div class="q">무슨 문제를 다뤘나</div><div class="a">${esc(p.ai.p)}</div></div>
       <div class="ai-q"><div class="q">어떻게 해결했나</div><div class="a">${esc(p.ai.s)}</div></div>
       <div class="ai-q"><div class="q">기획 관점에서 무엇을 배울 수 있나</div><div class="a">${esc(p.ai.l)}</div></div>
     </div>
     ${p.parsed&&p.body?'<div class="sec-title">원문 · 문장을 탭하면 하이라이트·메모 (나만 보기)</div>':''}
     ${bodyHtml}
     <div class="sec-title">독후감 ${revs.length}</div>
     <button class="btn outline" style="margin-bottom:10px" onclick="pushView({type:'writeReview',pid:'${pid}'})">독후감 남기기</button>
     ${revs.length? revs.map(reviewBlock).join('') : emptyInvite('첫 번째 독후감을 남겨보세요')}
     <div style="height:40px"></div>
   </div>`;
  const sc=screen();
  sc.onscroll=()=>{ if(!p.read && (sc.scrollTop+sc.clientHeight)/sc.scrollHeight>=0.9){ p.read=true; toast('다 읽음으로 표시했어요'); } };
}
function reviewBlock(r){
  const qs=['인상 깊은 부분','업무 적용','인사이터에게 질문'];
  return `<div class="review">
    <div class="who"><span class="avatar">${r.ini}</span><span style="font-size:13px;font-weight:500">${esc(r.author)}</span><span class="meta mono" style="margin-left:auto">${r.date}</span></div>
    ${r.ans.map((a,i)=>a&&a.trim()?`<div class="rq"><div class="q">${qs[i]}</div><div class="a">${esc(a)}</div></div>`:'').join('')}
    <div class="foot"><span class="a" onclick="openReview('${r.id}')">${IC.comment} 댓글 ${r.comments.length}</span></div>
  </div>`;
}
function tapSentence(pid,i){
  const hl=state.highlights[pid]||(state.highlights[pid]=new Set());
  if(hl.has(i)){ hl.delete(i); if(state.memos[pid])delete state.memos[pid][i]; render(); }
  else { hl.add(i); render(); setTimeout(()=>{const m=prompt('이 문장에 메모를 남길까요 (나만 보기 · 취소 시 하이라이트만)'); if(m&&m.trim()){(state.memos[pid]||(state.memos[pid]={}))[i]=m.trim(); render();}},50); }
}
function toggleBookmark(pid){ const p=posts.find(x=>x.id===pid); p.bookmarked=!p.bookmarked; render(); toast(p.bookmarked?'북마크에 저장했어요':'북마크를 해제했어요'); }
function gotoCompFeed(comp){ state.tab='feed'; state.view=null; state.feedSeg='all'; state.feedPreselectComp=comp; render(); }

/* ============ WRITE REVIEW ============ */
function renderWriteReview(pid){
  const p=posts.find(x=>x.id===pid);
  screen().innerHTML=`
   <div class="appbar"><button class="iconbtn" onclick="back()">${IC.x}</button><span class="title" style="font-size:17px">독후감 쓰기</span><span class="spacer"></span>
     <button class="btn primary" style="width:auto;padding:8px 16px;font-size:13px" id="rvSubmit" onclick="submitReview('${pid}')" disabled>게시</button></div>
   <div class="pad">
     <div class="card" style="--catc:${CATC[p.cat]};cursor:default"><div class="meta mono">${COMPANIES[p.comp].domain}</div><h3 style="margin-top:5px">${esc(p.title)}</h3></div>
     <div class="hint" style="margin:6px 0 16px">3개 질문 중 최소 1개만 채워도 게시할 수 있어요</div>
     <div class="field"><label>인상 깊은 부분이 무엇이었나요</label><textarea class="input" rows="3" oninput="checkReview()" id="rq0"></textarea></div>
     <div class="field"><label>업무에 어떻게 적용할 수 있나요</label><textarea class="input" rows="3" oninput="checkReview()" id="rq1"></textarea></div>
     <div class="field"><label>인사이터들에게 하고 싶은 질문이 있다면</label><textarea class="input" rows="3" oninput="checkReview()" id="rq2"></textarea></div>
     <div style="height:20px"></div>
   </div>`;
}
function checkReview(){ $('rvSubmit').disabled=![0,1,2].some(i=>$('rq'+i).value.trim()); }
function submitReview(pid){
  const ans=[0,1,2].map(i=>$('rq'+i).value.trim()); if(!ans.some(a=>a))return;
  reviews.push({id:'r'+Date.now(),postId:pid,author:'다람쥐',ini:'다',date:'방금',ans,comments:[]});
  state.view={type:'detail',pid}; render(); toast('독후감을 게시했어요');
}

/* ============ REGISTER ============ */
function renderRegister(){
  screen().innerHTML=`
   <div class="appbar"><button class="iconbtn" onclick="back()">${IC.x}</button><span class="title" style="font-size:17px">글 등록</span><span class="spacer"></span>
     <button class="btn primary" style="width:auto;padding:8px 16px;font-size:13px" id="regSubmit" onclick="submitRegister()" disabled>등록</button></div>
   <div class="pad">
     <div class="field"><label>URL</label><input class="input" id="regUrl" placeholder="공유할 기사·블로그 링크 붙여넣기" oninput="checkDup()"/>
       <div class="hint" id="dupHint">등록하면 제목·기업·태그·AI 요약은 자동으로 채워져요</div></div>
     <div class="field"><label>독후감 · 최소 1개 필수</label>
       <textarea class="input" rows="3" placeholder="인상 깊은 부분이 무엇이었나요" oninput="checkReg()" id="gq0" style="margin-bottom:8px"></textarea>
       <textarea class="input" rows="3" placeholder="업무에 어떻게 적용할 수 있나요" oninput="checkReg()" id="gq1" style="margin-bottom:8px"></textarea>
       <textarea class="input" rows="3" placeholder="인사이터들에게 하고 싶은 질문이 있다면" oninput="checkReg()" id="gq2"></textarea></div>
     <button class="btn ghost" onclick="saveDraft()">임시저장</button>
     <div style="height:30px"></div>
   </div>`;
}
function checkDup(){
  const v=$('regUrl').value.trim(); const h=$('dupHint');
  if(v.includes('toss.tech/article/priority')) h.innerHTML=`이미 등록된 글이에요 <a onclick="openDetail('g1')" style="color:var(--blue);cursor:pointer">등록 글 보기</a>`;
  else h.textContent='등록하면 제목·기업·태그·AI 요약은 자동으로 채워져요';
  checkReg();
}
function checkReg(){ $('regSubmit').disabled=![0,1,2].some(i=>$('gq'+i).value.trim()); }
function submitRegister(){ if(![0,1,2].some(i=>$('gq'+i).value.trim()))return; toast('글을 등록했어요'); state.tab='home'; state.view=null; render(); }
function saveDraft(){ toast('임시저장했어요'); state.tab='my'; state.mySeg='insight'; state.view=null; render(); }

/* ============ REVIEW COMMENT DRAWER ============ */
function openReview(rid){
  state.activeReview=rid;
  const r=reviews.find(x=>x.id===rid); const p=posts.find(x=>x.id===r.postId);
  const d=$('drawer');
  d.innerHTML=`<div class="handle"></div>
    <div class="dhead">독후감 댓글 ${r.comments.length}<span class="spacer" style="flex:1"></span><button class="iconbtn" onclick="closeDrawer()">${IC.x}</button></div>
    <div class="dbody">
      <div class="review plain" style="margin-bottom:14px">
        <div class="who"><span class="avatar">${r.ini}</span><span style="font-size:13px;font-weight:500">${esc(r.author)}</span><span class="meta mono" style="margin-left:auto">${esc(p.title)}</span></div>
        <div class="rq"><div class="a">${esc(r.ans.find(a=>a&&a.trim())||'')}</div></div>
      </div>
      <div id="commentList">${r.comments.map(commentBlock).join('')||emptyInvite('첫 댓글을 남겨보세요')}</div>
    </div>
    <div class="dfoot"><input id="commentInput" placeholder="독후감에 댓글 달기" onkeydown="if(event.key==='Enter')sendComment()"/><button class="sendbtn" onclick="sendComment()">${IC.send}</button></div>`;
  $('scrim').classList.add('show'); d.classList.add('show');
}
function commentBlock(c){ return `<div class="comment"><span class="avatar">${c.ini}</span><div><div class="nm">${esc(c.author)}</div><div class="tx">${esc(c.tx)}</div><div class="tm">${c.tm}</div></div></div>`; }
function sendComment(){
  const inp=$('commentInput'); const v=inp.value.trim(); if(!v)return;
  const r=reviews.find(x=>x.id===state.activeReview);
  r.comments.push({author:'다람쥐',ini:'다',tx:v,tm:'방금'});
  $('commentList').innerHTML=r.comments.map(commentBlock).join(''); inp.value='';
  $('drawer').querySelector('.dhead').firstChild.textContent=`독후감 댓글 ${r.comments.length}`;
}
function closeDrawer(){ $('scrim').classList.remove('show'); $('drawer').classList.remove('show'); if(state.tab==='insight'&&!state.view)render(); }

render();
</script>
</body>
</html>
